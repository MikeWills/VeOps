# Deploys VeOps (Worker + Web) to the production Ubuntu server over Tailscale.
#
# Trigger: pushing a version tag (YYYY.MM.PATCH, e.g. 2026.09.0) -- never on every commit to main.
#
# Layout on the box (see ops/setup-server.sh and docs/deployment.md):
#   /opt/vesessionmanager/releases/<tag>/{web,worker}   every deployed build, newest 5 kept
#   /opt/vesessionmanager/current -> releases/<tag>      what the systemd units run
#
# A deploy rsyncs the new build BESIDE the running one (no downtime yet), then hands off to
# ops/deploy-release on the box, which snapshots the key ring and database, stops the services,
# flips `current`, starts them, and health-checks with the real Host header. If health fails it
# flips `current` back to the previous release and restarts it -- the box is never left on a broken
# build. Code rollback is automatic; a schema migration is not undone by it (see the runbook).
#
# Required repo secrets (see docs/deployment.md for setup):
#   TS_OAUTH_CLIENT_ID  - Tailscale OAuth client ID (tag:ci) -- same client already used by NcsScheduler
#   TS_OAUTH_SECRET     - Tailscale OAuth client secret
#   SSH_PRIVATE_KEY     - THIS app's deploy key; its public half is installed on the box with a
#                         forced command (ops/ssh-deploy-command) that only accepts an rsync into
#                         releases/, "deploy <tag>" and "prune"
#   DEPLOY_HOST         - server's Tailscale hostname/IP (e.g. myserver.tailXXXX.ts.net)
#   DEPLOY_HOST_KEY     - one line of `ssh-keyscan -H <DEPLOY_HOST>` -- the pinned host key
#   DEPLOY_USER         - deploy

name: Deploy

on:
  push:
    tags:
      # Calendar versions: 2026.09.0, 2026.09.1, 2026.10.0 ... (since 2026-09-12; v0.x.y before that).
      - '2[0-9][0-9][0-9].[0-9][0-9].[0-9]*'

env:
  APP: vesessionmanager
  DEPLOY_PATH: /opt/vesessionmanager

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Two tags pushed close together would otherwise race each other on the box -- each stops the
    # services the other just started. Queue them instead.
    concurrency: deploy-production
    # Needed by the Publish release step below. Scoped to this job rather than the workflow so
    # build-and-test keeps the default read-only token.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish Worker
        run: dotnet publish src/VeOps.Worker/VeOps.Worker.csproj -c Release -o publish/worker -p:InformationalVersion=${{ github.ref_name }}

      - name: Publish Web
        run: dotnet publish src/VeOps.Web/VeOps.Web.csproj -c Release -o publish/web -p:InformationalVersion=${{ github.ref_name }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        # The host key is PINNED from a secret, not learned with ssh-keyscan on every run. The old
        # trust-on-first-use form accepted whatever answered (audit item L-03); it was tolerated
        # because WireGuard already authenticates the peer, but pinning costs one secret and closes
        # it. A missing secret fails loudly rather than falling back to keyscan -- a deploy that
        # silently downgrades its own check is worse than one that stops and says so.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -z "${{ secrets.DEPLOY_HOST_KEY }}" ]; then
            echo "DEPLOY_HOST_KEY secret is not set. On any machine that can reach the box:"
            echo "  ssh-keyscan -H <DEPLOY_HOST>"
            echo "and store one of the lines it prints as the DEPLOY_HOST_KEY repo secret."
            exit 1
          fi
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          echo "SSH=ssh -i $HOME/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" >> "$GITHUB_ENV"

      - name: Upload release beside the running one
        # No sudo, no --chown (#254): releases/ is owned by the deploy user with the service
        # account's group and setgid directories, so deploy writes as itself and the service reads
        # through the group. The forced command on the far end only accepts a destination of the
        # form releases/<tag>/{web,worker}/ -- never current/, never the running release -- so the
        # services keep serving the old build untouched while this runs. --delete is a no-op into a
        # fresh directory and stays so a re-run of the same tag replaces rather than merges.
        #
        # *.db* and *.bak-* are excluded defensively (the data lives under /var/lib, outside this
        # tree entirely). 'logs' too: Serilog writes to /var/lib/vesessionmanager/logs now, but a
        # relative logs/ would land inside a release and be pruned with it (#267), so the exclude
        # stays as a guard against that ever being reintroduced.
        run: |
          for host in worker web; do
            rsync -avz --delete \
              --exclude '*.db' \
              --exclude '*.db-shm' \
              --exclude '*.db-wal' \
              --exclude '*.bak-*' \
              --exclude 'logs' \
              -e "ssh -i ~/.ssh/deploy_key" \
              publish/$host/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DEPLOY_PATH/releases/${{ github.ref_name }}/$host/"
          done

      - name: Snapshot data, switch release, start, health check (auto-rollback on failure)
        # Every server-side ordering rule lives in ops/deploy-release, one reviewed script instead
        # of eight ssh calls: key ring snapshot, Web stopped before Worker, database snapshot after
        # the stop (WAL -- #255/#343), Worker started and confirmed active before Web, health
        # checked with the Host header read from the release's own AllowedHosts (a 400 from host
        # filtering used to pass as healthy), and the flip back to the previous release if any of
        # that fails. sudo on the box is one exact rule per command, no wildcards (#254) -- the
        # combined "systemctl stop a b" form matches nothing and is rejected as "a password is
        # required", which is why it is one unit per call in there too.
        run: $SSH "deploy ${{ github.ref_name }}"

      - name: Prune old releases
        # Newest 5 by version, never the one `current` points at. Enough to flip back several
        # releases by hand without a rebuild; not so many that a build every few days fills the disk.
        run: $SSH "prune"

      # Everything below runs only once the deploy is proven good. A release is a claim that this
      # version works somewhere, so publishing one for a failed deploy would be worse than
      # publishing nothing -- which is why this sits after the health check rather than next to the
      # publish steps that produced the binaries.
      - name: Package binaries
        run: |
          mkdir -p artifacts
          (cd publish/worker && zip -qr ../../artifacts/veops-worker-${{ github.ref_name }}.zip .)
          (cd publish/web    && zip -qr ../../artifacts/veops-web-${{ github.ref_name }}.zip .)
          ls -lh artifacts

      # Notes come from the annotated tag message, which is where the release notes for this repo
      # are already written. --verify-tag refuses to invent a release for a tag that does not exist,
      # and the || branch makes a re-run of an already-released tag upload the assets again instead
      # of failing the whole deploy after it has already succeeded.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists -- updating its assets."
            gh release upload "${{ github.ref_name }}" artifacts/* --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-from-tag \
              --verify-tag \
              artifacts/*
          fi
