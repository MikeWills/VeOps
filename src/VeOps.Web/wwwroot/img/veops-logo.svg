<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">VE Ops logo</title>
  <desc id="desc">Amber rounded-square radio operations icon with VE Ops wordmark.</desc>

  <!-- Brand colors -->
  <!-- Amber: #E8A33D | Ink: #1B2023 -->

  <g id="icon" transform="translate(30,30)">
    <rect x="0" y="0" width="260" height="260" rx="44" fill="#E8A33D"/>

    <!-- RF / radio waves -->
    <path d="M54 98 Q130 26 206 98"
          fill="none" stroke="#1B2023" stroke-width="18"
          stroke-linecap="round"/>
    <path d="M78 126 Q130 76 182 126"
          fill="none" stroke="#1B2023" stroke-width="18"
          stroke-linecap="round"/>
    <circle cx="130" cy="150" r="13" fill="#1B2023"/>

    <!-- Radio body -->
    <rect x="42" y="172" width="176" height="58" rx="15" fill="#1B2023"/>

    <!-- Radio display -->
    <rect x="59" y="188" width="78" height="26" rx="5" fill="#E8A33D"/>

    <!-- Radio controls -->
    <rect x="154" y="187" width="14" height="14" rx="3" fill="#E8A33D"/>
    <rect x="177" y="187" width="14" height="14" rx="3" fill="#E8A33D"/>
    <rect x="154" y="207" width="14" height="14" rx="3" fill="#E8A33D"/>
    <rect x="177" y="207" width="14" height="14" rx="3" fill="#E8A33D"/>
  </g>

  <!-- Wordmark kept as live vector text for easy editing.
       Font stack intentionally starts with JetBrains Mono, matching the VE Ops UI identity. -->
  <g id="wordmark" fill="#1B2023">
    <text x="335" y="205"
          font-family="'JetBrains Mono', 'IBM Plex Mono', 'DejaVu Sans Mono', monospace"
          font-size="148"
          font-weight="700"
          letter-spacing="-7">VE Ops</text>
  </g>
</svg>
